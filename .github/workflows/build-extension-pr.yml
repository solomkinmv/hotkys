# Workflow to build extension PR
name: Build extension PR

on:
  # Runs on pull requests targeting the default branch
  pull_request:
    branches:
      - main
    paths:
      - 'shortcuts-disco-site/shortcuts-data/**'
      - 'shortcuts-disco-site/public/data/key-codes.json'
      - 'shortcuts-raycast-extension/**' # Trigger only for changes in this directory
      - 'shared/**'
      - 'scripts/**'
      - '.github/workflows/build-extension-pr.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    # Set the default working directory for run steps
    defaults:
      run:
        working-directory: shortcuts-raycast-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          # Cache path relative to the repo root
          cache-dependency-path: shortcuts-raycast-extension/package-lock.json

      - name: Verify shared shortcut contracts
        run: node ../scripts/sync-shortcuts-core.mjs --check

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --runInBand

      - name: Type check
        run: npm run test:types

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
