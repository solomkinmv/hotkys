# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - 'shortcuts-disco-site/**' # Trigger only when files in this directory change
      - '.github/workflows/deploy-pages.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Default every job to read-only repository access.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
      deployment: false
    runs-on: ubuntu-latest
    # Set the default working directory for run steps to avoid repeating 'cd'
    defaults:
      run:
        working-directory: shortcuts-disco-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          # Cache path should be relative to the repo root
          cache-dependency-path: shortcuts-disco-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate production auth configuration
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          case "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}" in
            pk_live_*) ;;
            *)
              echo "::error::GitHub Pages production deploy requires a Clerk production publishable key that starts with pk_live_."
              exit 1
              ;;
          esac
          if ! test -n "${NEXT_PUBLIC_SUPABASE_URL}"; then
            echo "::error::GitHub Pages production deploy requires NEXT_PUBLIC_SUPABASE_URL."
            exit 1
          fi
          if ! test -n "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" && ! test -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY}"; then
            echo "::error::GitHub Pages production deploy requires a Supabase publishable or anon key."
            exit 1
          fi

      - name: Build static site
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /auth/login
          NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /
          NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Path is relative to the repo root
          path: 'shortcuts-disco-site/out'

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
